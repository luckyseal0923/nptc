<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>重設您的學員帳號密碼</title>
  </head>
  <body style="margin: 0; padding: 0; background: #f5f7f3; color: #123f3b">
    <div
      style="
        margin: 0;
        padding: 32px 16px;
        background: #f5f7f3;
        color: #123f3b;
        font-family: 'Noto Sans TC', 'Microsoft JhengHei', Arial, sans-serif;
      "
    >
      <div
        style="
          max-width: 600px;
          margin: 0 auto;
          padding: 36px;
          background: #ffffff;
          border: 1px solid #d9e2da;
          border-radius: 12px;
        "
      >
        <div style="margin-bottom: 28px">
          <div style="font-size: 14px; letter-spacing: 2px; color: #55766f">
            NP・OSCE WORKSHOP
          </div>
          <h1 style="margin: 8px 0 0; font-size: 26px; line-height: 1.4; color: #0d4742">
            重設您的學員帳號密碼
          </h1>
        </div>

        <p style="margin: 0 0 16px; font-size: 16px; line-height: 1.8">您好：</p>

        <p style="margin: 0 0 16px; font-size: 16px; line-height: 1.8">
          我們收到「萬芳H專師訓練中心」學員系統的密碼重設申請。請點選下方按鈕，設定新的登入密碼。
        </p>

        <div style="margin: 30px 0; text-align: center">
          <a
            href="{{ .ConfirmationURL }}"
            style="
              display: inline-block;
              padding: 14px 30px;
              background: #0d4742;
              color: #ffffff;
              text-decoration: none;
              font-size: 16px;
              font-weight: 700;
              border-radius: 8px;
            "
          >設定新密碼</a
          >
        </div>

        <div
          style="
            margin: 24px 0;
            padding: 18px;
            background: #f2f6ed;
            border-left: 4px solid #7a9a63;
            border-radius: 4px;
          "
        >
          <p style="margin: 0; font-size: 14px; line-height: 1.8; color: #365b55">
            此連結具有時效性，且僅供本次密碼重設使用。<br />
            為保障帳號安全，請勿將本信或重設連結轉寄給他人。
          </p>
        </div>

        <p style="margin: 0 0 16px; font-size: 14px; line-height: 1.8; color: #526b66">
          如果您沒有提出密碼重設申請，請直接忽略本信；您目前的登入密碼不會因此改變。
        </p>

        <hr style="margin: 28px 0; border: 0; border-top: 1px solid #dfe7df" />

        <p style="margin: 0; font-size: 13px; line-height: 1.8; color: #71827e">
          此為系統自動寄送的帳號安全通知，請勿直接回覆。<br />
          萬芳H專師訓練中心｜學員系統
        </p>
      </div>
    </div>
  </body>
</html>
